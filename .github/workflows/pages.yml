name: Free web app
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**','README*.md','THIRD_PARTY_NOTICES.md']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    # Match the audited Windows build environment used by desktop CI.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit
      # Audit the complete reproducible lockfile rather than an OS-filtered
      # installed tree. Do not fall through a failed security check.
      - run: npm audit --package-lock-only --audit-level=high --fetch-timeout=30000 --fetch-retries=2
      - run: npm run check
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - run: node scripts/verify-dist.mjs
        env:
          GITHUB_PAGES: 'true'
      - run: node scripts/verify-offline.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: verified-web-dist
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-web-dist
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
